[window]
decorations = "full"
dynamic_title = true

[scrolling]
history = 65536

[font]
size = 11.0

[font.normal]
family = "LiterationMono Nerd Font"

[cursor]
style = { shape = "Block", blinking = "Always" }

# Solarized Light
[colors.primary]
foreground = "#073642"
background = "#fdf6e3"

[colors.normal]
black   = "#073642"
red     = "#dc322f"
green   = "#859900"
yellow  = "#b58900"
blue    = "#268bd2"
magenta = "#d33682"
cyan    = "#2aa198"
white   = "#eee8d5"

[colors.bright]
black   = "#002b36"
red     = "#cb4b16"
green   = "#586e75"
yellow  = "#657b83"
blue    = "#839496"
magenta = "#6c71c4"
cyan    = "#93a1a1"
white   = "#fdf6e3"
